name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.17.0"
  TFLINT_VERSION: "v0.65.0"
  CHECKOV_VERSION: "3.3.30"

jobs:
  app:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: app:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 app:ci
          for i in $(seq 1 10); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/version | grep -q '"version":"${{ github.sha }}"'
          docker exec app /server -healthcheck
          docker rm -f app

  terraform:
    name: Terraform fmt, validate & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff terraform
      - name: Validate every stack
        run: |
          for dir in terraform/bootstrap terraform/environments/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Checkov
        run: pipx run checkov==${{ env.CHECKOV_VERSION }} --config-file .checkov.yaml --directory .

  deploy:
    name: Deploy to dev
    # Runs on main only after every check passes, and only once AWS is configured
    # (see README > Deploy). Forks and fresh clones stay green without AWS access.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    needs: [app, image, terraform, security]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.output.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC: exchange the GitHub token for short-lived AWS credentials
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image (tagged with the commit SHA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.PROJECT || 'ecs-fargate-demo' }}:${{ env.IMAGE_TAG }}
          build-args: VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform apply -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - id: output
        name: Read service URL
        working-directory: terraform/environments/dev
        run: echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live service
        run: |
          url="${{ steps.output.outputs.url }}"
          for i in $(seq 1 20); do
            if curl -fsS "$url/version" | grep -q "\"version\":\"${IMAGE_TAG}\""; then
              echo "Live: $url is serving ${IMAGE_TAG}"; exit 0
            fi
            sleep 15
          done
          echo "Service did not serve ${IMAGE_TAG} in time"; exit 1
