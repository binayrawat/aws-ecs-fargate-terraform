version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/environments/dev
    schedule:
      interval: monthly
